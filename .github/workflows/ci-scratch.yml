name: ci-scratch

# Temporary, for this branch only: times four ways to install pnpm on Windows.
# Removed before review.
on:
  push:
    branches: ["aakash/ci-quick-wins"]

permissions:
  contents: read

jobs:
  pnpm-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant:
          [
            action-default,
            action-dest-runner-temp,
            action-standalone,
            npm-global,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (action, default dest)
        if: matrix.variant == 'action-default'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up pnpm (action, dest under runner.temp)
        if: matrix.variant == 'action-dest-runner-temp'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up pnpm (action, standalone)
        if: matrix.variant == 'action-standalone'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up pnpm (npm global)
        if: matrix.variant == 'npm-global'
        run: npm install --global --no-audit --no-fund (node -p "require('./package.json').packageManager")

      - name: Show pnpm
        run: |
          (Get-Command pnpm).Source
          pnpm --version
