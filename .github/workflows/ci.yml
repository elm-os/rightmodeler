name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # A branch push already checks same-repository changes; pull_request CI is for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # No version input on purpose: the action reads it from the root package.json
        # packageManager field, which pnpm itself also uses to self-manage. A second
        # pin here would be a second source of truth. Corepack is deliberately unused.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Mode B fixture image
        run: |
          docker pull node:24-bookworm-slim
          fixture_digest="$(sha256sum harness/fixtures/langgraph-app/requirements.txt | cut -c1-12)"
          fixture_image="rightmodeler-modeb-langgraph:${fixture_digest}"
          docker build --tag "${fixture_image}" --file - harness/fixtures/langgraph-app <<'DOCKERFILE'
          FROM node:24-bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends python3 python3-pip && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt /tmp/requirements.txt
          RUN pip3 install --break-system-packages --no-cache-dir -r /tmp/requirements.txt
          DOCKERFILE

      - name: Check
        run: pnpm check

      - name: Refuse a stale committed CLI bundle
        # Check built the CLI, so the committed bundle must equal that build byte for byte.
        run: |
          stale="$(git status --porcelain -- harness/packages/rightmodeler/dist-bundle)"
          if [ -n "${stale}" ]; then
            printf '%s\n' "${stale}" >&2
            echo "harness/packages/rightmodeler/dist-bundle differs from a fresh build. Run pnpm exec turbo run build --filter=@rightmodeler/cli and commit the result." >&2
            exit 1
          fi

  windows:
    # Native Windows, without Docker: hosted Windows runners run only Windows containers, so
    # the Docker suites skip here and stay covered by the ci job. Advisory until it is green.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      RIGHTMODELER_SKIP_DOCKER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Same as the ci job: the version comes from the packageManager field only.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        # pnpm runs package scripts through cmd.exe. Drop Git's Unix tools from PATH so a script
        # that needs rm or bash fails here as it would on a stock Windows machine.
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\(usr\\|mingw64\\)?bin\\?$' }) -join ';'
          pnpm check

      - name: Refuse a CLI bundle that differs from the Windows build
        shell: pwsh
        run: |
          $stale = git status --porcelain -- harness/packages/rightmodeler/dist-bundle
          if ($stale) {
            $stale
            Write-Error "harness/packages/rightmodeler/dist-bundle differs from a fresh Windows build."
            exit 1
          }

  unprivileged-artifacts:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # No version input on purpose: the action reads it from the root package.json
        # packageManager field, which pnpm itself also uses to self-manage. A second
        # pin here would be a second source of truth. Corepack is deliberately unused.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Mode B fixture image
        run: |
          docker pull node:24-bookworm-slim
          fixture_digest="$(sha256sum harness/fixtures/langgraph-app/requirements.txt | cut -c1-12)"
          fixture_image="rightmodeler-modeb-langgraph:${fixture_digest}"
          docker build --tag "${fixture_image}" --file - harness/fixtures/langgraph-app <<'DOCKERFILE'
          FROM node:24-bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends python3 python3-pip && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt /tmp/requirements.txt
          RUN pip3 install --break-system-packages --no-cache-dir -r /tmp/requirements.txt
          DOCKERFILE

      - name: Check
        run: pnpm check

      - name: Write inert check result
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p guarded-input
          node -e 'require("node:fs").writeFileSync("guarded-input/check-result.json", JSON.stringify({headSha: process.env.HEAD_SHA, check: "passed"}) + "\n")'

      - name: Upload inert check result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guarded-input
          path: guarded-input/check-result.json
          if-no-files-found: error

  # This environment may gain brokered credentials later. It checks out only the base revision
  # and treats the pull-request artifact as inert data; no pull-request-controlled code runs here.
  guarded-live:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: unprivileged-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: harness-live
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base

      - name: Download inert check result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guarded-input
          path: guarded-input

      # Replace this validation with a committed base-repository consumer when live inputs exist.
      - name: Validate inert check result
        working-directory: trusted-base
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          node -e 'const value = JSON.parse(require("node:fs").readFileSync("../guarded-input/check-result.json", "utf8")); if (value.check !== "passed" || value.headSha !== process.env.EXPECTED_HEAD_SHA || Object.keys(value).sort().join(",") !== "check,headSha") process.exit(1)'
